services:
  - type: web
    name: nugget
    runtime: node
    buildCommand: >-
      curl -fsSL https://bun.sh/install | bash &&
      mkdir -p "$HOME/.cre/bin" &&
      tmp="$(mktemp)" &&
      curl -fsSL -o "$tmp" https://github.com/smartcontractkit/cre-cli/releases/download/v1.32.0/cre_linux_amd64_ldd2-35.tar.gz &&
      tar -xzf "$tmp" -C "$HOME/.cre/bin" &&
      mv "$HOME/.cre/bin/cre_v1.32.0_linux_amd64" "$HOME/.cre/bin/cre" &&
      chmod +x "$HOME/.cre/bin/cre" &&
      rm "$tmp" &&
      export PATH="$HOME/.cre/bin:$HOME/.bun/bin:$PATH" &&
      cd cre-hello-confidential/my-workflow &&
      bun install --frozen-lockfile &&
      cd ../../web &&
      bun install --frozen-lockfile &&
      bun run build
    startCommand: >-
      mkdir -p "$HOME/.cre" &&
      cp /etc/secrets/cre.yaml "$HOME/.cre/cre.yaml" &&
      cp /etc/secrets/context.yaml "$HOME/.cre/context.yaml" &&
      $HOME/.bun/bin/bun --cwd web run start -- -H 0.0.0.0 -p $PORT
    healthCheckPath: /
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRE_PUBLIC_KEY
        sync: false
      - key: CRE_ENCRYPTION_PRIVATE_KEY
        sync: false
      - key: NUGGET_BATCH_ESCROW_ADDRESS
        sync: false
      - key: NEXT_PUBLIC_NUGGET_BATCH_ESCROW_ADDRESS
        sync: false
      - key: SETTLEMENT_REPORTER_PRIVATE_KEY
        sync: false
      - key: NEXT_PUBLIC_PRIVY_APP_ID
        sync: false
      - key: NEXT_PUBLIC_BUYER_PAYMENT_WEI
        sync: false
      - key: BUYER_PAYMENT_WEI
        sync: false
      - key: SEPOLIA_RPC_URL
        sync: false
